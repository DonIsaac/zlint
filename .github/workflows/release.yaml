name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  ZIG_VERSION: 0.16.0

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    strategy:
      # keep building others in case it's os-specific
      fail-fast: false
      matrix:
        os: [linux, windows, macos]
        arch: [aarch64, x86_64]
        # riscv64 and loongarch64 are published for Linux only (there are no
        # macOS/Windows builds for those arches), so add them as explicit
        # combinations instead of expanding the full os/arch grid.
        include:
          - os: linux
            arch: riscv64
          - os: linux
            arch: loongarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Get binary name
        id: binary_name
        run: |
          binary_name=zlint-${{ matrix.os }}-${{ matrix.arch }}
          if [[ "${{ matrix.os }}" == "windows" ]] ; then
            binary_name="${binary_name}.exe"
          fi
          echo "binary_name=$binary_name" >> "$GITHUB_OUTPUT"

      - name: zig build
        env:
          BINARY_NAME: ${{ steps.binary_name.outputs.binary_name }}
        run: |
          binary_name=zlint
          if [[ "${{ matrix.os }}" == "windows" ]] ; then
            binary_name="${binary_name}.exe"
          fi
          zig build --summary all --color on \
            --release=safe \
            -Dversion=${{ github.ref_name }} \
            -Dtarget=${{ matrix.arch }}-${{ matrix.os }}
          mv zig-out/bin/${binary_name} zig-out/bin/${{ env.BINARY_NAME }}

      # ELF is the only output format that inlines DWARF into the executable, so
      # Linux assets ship ~5x larger than the equivalent macOS/Windows ones. Split
      # the debug info out into a companion `.debug` asset instead.
      # `zig objcopy` can't do this (its ELF->ELF path is unimplemented on 0.16).
      - name: Strip debug info
        if: matrix.os == 'linux'
        env:
          BINARY_NAME: ${{ steps.binary_name.outputs.binary_name }}
        run: |
          objcopy="$(command -v llvm-objcopy || true)"
          if [ -z "$objcopy" ]; then
            objcopy="$(ls -1 /usr/lib/llvm-*/bin/llvm-objcopy 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -z "$objcopy" ]; then
            sudo apt-get update && sudo apt-get install -y llvm
            objcopy="$(ls -1 /usr/lib/llvm-*/bin/llvm-objcopy | sort -V | tail -n1)"
          fi
          echo "using $objcopy"
          cd zig-out/bin
          before=$(stat -c%s "$BINARY_NAME")
          "$objcopy" --only-keep-debug "$BINARY_NAME" "$BINARY_NAME.debug"
          "$objcopy" --strip-all --add-gnu-debuglink="$BINARY_NAME.debug" "$BINARY_NAME"
          after=$(stat -c%s "$BINARY_NAME")
          echo "$BINARY_NAME: $before -> $after bytes"
          ls -l "$BINARY_NAME" "$BINARY_NAME.debug"
          # runner is x86_64 linux, so this asset is native - prove strip didn't break it
          if [ "${{ matrix.arch }}" = "x86_64" ]; then ./"$BINARY_NAME" --version; fi

      # must run after stripping so the attested digest matches the published binary
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        env:
          BINARY_NAME: ${{ steps.binary_name.outputs.binary_name }}
        with:
          subject-path: zig-out/bin/${{ env.BINARY_NAME }}

      - name: Upload zlint binary
        uses: actions/upload-artifact@v7
        env:
          BINARY_NAME: ${{ steps.binary_name.outputs.binary_name }}
        with:
          # `.debug` only exists for linux; upload-artifact roots multi-path
          # uploads at the least-common-ancestor, so both land flat.
          path: |
            zig-out/bin/${{ env.BINARY_NAME }}
            zig-out/bin/${{ env.BINARY_NAME }}.debug
          name: ${{ env.BINARY_NAME }}
          retention-days: 1

  release:
    # Not used. Leaving here in case we want to create canary builds
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zlint-*
          path: zig-out/dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: zig-out/dist/*
